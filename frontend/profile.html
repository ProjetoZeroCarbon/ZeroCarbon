<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — ZeroCarbon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frontend/css/base.css">
<link rel="stylesheet" href="frontend/css/components.css">
<link rel="stylesheet" href="frontend/css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-side">
    <a class="logo" href="index.html"><span class="logo-mark">🌿</span>ZeroCarbon</a>
    <nav class="side-nav">
      <a class="side-link" href="dashboard.html">⌂ <span>Início</span></a>
      <a class="side-link" href="calculator.html">▣ <span>Calculadora</span></a>
      <a class="side-link" href="history.html">◴ <span>Histórico</span></a>
      <a class="side-link" href="profile.html">☺ <span>Perfil</span></a>
    </nav>
    <div class="side-goal"><div class="lbl">Meta mensal</div><div class="val">48% concluído</div><div class="side-bar"><i style="width:48%"></i></div></div>
    <button class="btn btn-ghost btn-block" data-logout style="margin-top:auto;">Sair</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div><h1>Perfil</h1><div class="sub">Gerencie seus dados e acompanhe suas conquistas.</div></div>
      <button class="theme-toggle" data-theme-toggle title="Alternar tema"><span class="moon">🌙</span><span class="sun">☀️</span></button>
    </div>

    <div class="profile-grid">
      <div class="card profile-card">
        <div class="avatar-lg"></div>
        <h3 data-profile-name>Minha conta</h3>
        <div class="loc" data-profile-location>—</div>
        <div class="badge-grid">
          <div class="achieve"><div class="ic">🏆</div><span>Meta batida</span></div>
          <div class="achieve"><div class="ic">🔥</div><span>4 meses seguidos</span></div>
          <div class="achieve"><div class="ic">🌱</div><span>Em breve...</span></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="card">
          <div class="card-title"><h3>Metas</h3></div>
          <div class="goal-row">
            <div><div class="settings-row-k">Meta mensal</div><div class="side-bar" style="width:220px;margin-top:8px;"><i style="width:80%"></i></div></div>
            <div class="sub">2.0 tCO₂ · 80%</div>
          </div>
          <div class="goal-row">
            <div><div class="settings-row-k">Meta anual</div><div class="side-bar" style="width:220px;margin-top:8px;"><i style="width:55%"></i></div></div>
            <div class="sub">20 tCO₂ · 55%</div>
          </div>
        </div>

        <form class="card" id="profileForm">
          <div class="card-title"><h3>Conta</h3></div>
          <div class="field"><label for="p-email">E-mail</label><input class="input" id="p-email" name="email" type="email" data-profile-email placeholder="seu@email.com"></div>
          <div class="field"><label for="p-location">Cidade / Estado</label><input class="input" id="p-location" name="location" placeholder="São Paulo, SP"></div>
          <button class="btn btn-primary" type="submit">Salvar alterações</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/nav.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
